  - aid: national-university-of-colombia:datos-gov-co-publisher
    name: UNAL open data on datos.gov.co (Socrata)
    x-operator: tenant
    description: >-
      UNAL's open data is not published on its own portal. datosabiertos.unal.edu.co is a static
      informational page with no catalogue and no API; the actual datasets sit on Colombia's
      national Socrata portal datos.gov.co under the named publisher scope "Universidad Nacional
      de Colombia, Bogota D.C." — six datasets as of 2026-09-01 (Microdatos Personal
      Administrativo UNAL 6rvy-hipa, Microdatos Docentes de Carrera UNAL uvhe-aufw, Estudiantes
      Graduados UNAL 3j5e-x7c4, Estudiantes matriculados UNAL 5pqr-ifsd, Microdatos Aspirantes y
      Admitidos mqpd-2jhs, Microdatos Resultados Prueba Saber Pro g6ci-7e9g). The data is UNAL's;
      the SODA contract is Socrata's, so no vendor spec is saved. Verified live 2026-09-01:
      /resource/5pqr-ifsd.json returns 200. Note the dataset UNAL itself links from
      datosabiertos.unal.edu.co (ps24-42h9) is dead — 404 dataset.missing.
    humanURL: https://datosabiertos.unal.edu.co/
