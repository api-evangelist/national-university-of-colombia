  - aid: national-university-of-colombia:open-data
    name: UNAL Open Data Portal
    description: >-
      Datos Abiertos Universidad Nacional de Colombia is the institution's open
      data portal publishing primary, interoperable datasets for public reuse.
      The portal resolves publicly but does not advertise a documented API or
      developer endpoints; data access appears to be via the portal interface.
    humanURL: https://datosabiertos.unal.edu.co/
