x-coverage:
  state: covered
  reason: covered
  detail: >-
    UNAL operates no central developer portal, no API gateway, no llms.txt, no ai.txt and no
    .well-known/apis.json, and this profile says so rather than padding around it. What it does
    operate on its own hosts was probed anonymously and confirmed: the DSpace 7.6.5 institutional
    repository REST root and its OAI-PMH 2.0 endpoint on bffrepositorio.unal.edu.co, and a SECOND
    OAI-PMH 2.0 endpoint found in this run on revistas.unal.edu.co (Portal de Revistas UN, OJS
    3.4.0.10, 100+ journal sets) which was not previously catalogued. Everything else in UNAL's
    footprint is a relationship, and each is recorded as one rather than as UNAL's engineering:
    six datasets under the named publisher scope "Universidad Nacional de Colombia, Bogota D.C."
    on Colombia's national Socrata portal datos.gov.co (x-operator tenant, no Socrata contract
    saved); Crossref membership 6146 / prefix 10.15446 and ROR 059yx9a68 (x-operator registry,
    memberships recorded, registry contracts not saved); and a self-hosted Ex Libris Aleph catalog
    at catalogo.unal.edu.co whose X-Services gate is reachable but answers every anonymous query
    with "SRU gate configuration file is missing", so it is not a usable API. Two negatives are
    findings, not gaps: UNAL has NO Shibboleth/SAML identity federation surface — login.unal.edu.co
    redirects to a commercial Google-identity broker (smartkey.xertica.com) and eduGAIN lists no
    Colombian federation at all — and it is NOT a DataCite provider, minting Handles rather than
    DataCite DOIs. unal.edu.co itself is flaky from outside Colombia: it returns 200 over IPv4
    without ALPN and times out on the default TLS/ALPN path, which is an edge-behaviour finding
    about their AWS load balancer, not a dead host.
