aid: national-university-of-colombia
name: National University of Colombia
description: >-
  The National University of Colombia (Universidad Nacional de Colombia, UNAL) is
  the country's largest public research university, ranked #219 in the QS World
  University Rankings 2025. UNAL maintains an open-data portal and a DSpace-based
  institutional repository, but does not publish a formal, documented public
  developer portal or REST API program. The most accessible programmatic surface
  is the OAI-PMH interface exposed by its institutional repository, alongside an
  open-data portal and an official GitHub organization with limited public code.
