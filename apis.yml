aid: national-university-of-colombia
name: National University of Colombia
description: >-
  The National University of Colombia (Universidad Nacional de Colombia, UNAL) is
  the country's largest public research university, ranked #219 in the QS World
  University Rankings 2025. UNAL operates NO central developer portal, no API
  gateway and no documented public API program, and no llms.txt, ai.txt or
  .well-known/apis.json exists on unal.edu.co. What it does operate, on its own
  hosts, is scholarly infrastructure: a DSpace 7.6.5 institutional repository at
  bffrepositorio.unal.edu.co with an anonymous HAL+JSON REST API and an OAI-PMH 2.0
  endpoint, and a second, independent OAI-PMH 2.0 endpoint on the Portal de Revistas
  UN (Open Journal Systems 3.4.0.10) serving 100+ journal sets. Beyond that its
  programmable footprint is relationships rather than engineering: six open datasets
  published as a named publisher scope on Colombia's national Socrata portal
  datos.gov.co, a self-hosted Ex Libris Aleph library catalog whose X-Services gate
  answers with a configuration error, Crossref membership (prefix 10.15446), a ROR
  identifier, and single sign-on brokered by a commercial vendor rather than a
  Shibboleth IdP. Colombia has no eduGAIN federation, so the identity-federation
  surface most universities have does not exist here.
