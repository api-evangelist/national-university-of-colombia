    name: Institutional Repository (DSpace / OAI-PMH)
    description: >-
      The Repositorio Institucional Universidad Nacional de Colombia is a DSpace
      repository of theses, dissertations, articles, books, and research data.
      It is registered with re3data and OpenDOAR as exposing an OAI-PMH metadata
      interface for harvesting. The repository web application resolves publicly;
      the OAI-PMH request endpoint path could not be confirmed live during review
      and should be re-verified against the current DSpace version before use.
